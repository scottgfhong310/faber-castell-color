<!doctype html>
<html lang="zh-Hant" data-theme="dark">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Faber-Castell 套組收錄對照</title>

  <!-- 防主題閃爍：與 index.html 同一把 localStorage 鑰匙（多頁 app 每頁都要，§5.1 坑） -->
  <script>
    try {
      var t = localStorage.getItem('faber-castell-color-theme') || 'dark';
      var r = document.documentElement;
      r.dataset.theme = t;
      r.classList.toggle('dark-mode', t === 'dark');
      r.classList.toggle('light-mode', t === 'light');
    } catch (e) { }
  </script>

  <!-- Materialize 1.0.0 + Material Icons -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css" />
  <!-- Materialize 元件深色（家族共用；在 materialize.css 之後、本頁樣式之前） -->
  <link rel="stylesheet" href="./materialize-dark.css" />

  <link rel="stylesheet" href="./faber-castell-color.css" />
  <link rel="stylesheet" href="./sets.css" />
  <link rel="stylesheet" href="./side-tool.css" />
</head>

<body data-i18n-doctitle="title.sets">

  <main>
    <div class="sets-page">

      <div class="topbar">
        <div>
          <h1 data-i18n="sets.pageTitle">套組收錄對照</h1>
          <div class="sub" data-i18n="sets.pageSub">哪個套組收了哪些色——形制對齊 Faber-Castell 官方色卡的收錄表</div>
        </div>
        <div class="owned-wrap" id="owned-wrap"></div>
      </div>

      <div class="legend" id="legend"></div>

      <!-- 一次只顯示選定的系列（由側鍵面板切換） -->
      <section class="matrix-sec" id="matrix"></section>

      <p class="matrix-foot" id="matrix-foot"></p>

    </div>
  </main>

  <!-- ===== 右側工具列（多頁 app 每頁都要有主題鍵，§5.5／§6） ===== -->
  <div class="side-tools">
    <div id="setting-setlist" class="side-tool" data-i18n-title="tool.setlist" title="選擇系列與已擁有的套組">
      <i class="material-icons">checklist</i>
    </div>
    <a id="setting-grid" class="side-tool" href="./" data-i18n-title="tool.grid" title="回色票網格">
      <i class="material-icons">grid_view</i>
    </a>
    <div id="setting-mode" class="side-tool" data-i18n-title="tool.mode" title="切換 light / dark">
      <i class="material-icons">dark_mode</i>
    </div>
    <div id="setting-lang" class="side-tool" data-i18n-title="tool.lang" title="Language">
      <i class="material-icons">translate</i>
    </div>
  </div>

  <!-- ===== 套組清單面板（側鍵開啟）：選系列 + 選「我已經有的」 ===== -->
  <div id="setlist-modal" class="modal setlist-modal">
    <div class="modal-content">
      <h5 data-i18n="setlist.title">選擇系列與套組</h5>

      <div class="setlist-block">
        <div class="setlist-label" data-i18n="setlist.pickSeries">選擇系列</div>
        <div class="series-tabs" id="series-tabs"></div>
      </div>

      <div class="setlist-block">
        <div class="setlist-label" data-i18n="setlist.pickOwned">我已經有的套組</div>
        <div class="setlist-hint" data-i18n="setlist.ownedHint">選一組之後，其餘套組會顯示相對它還能多帶來幾色；再點一次取消。</div>
        <div id="setlist" class="setlist"></div>
      </div>
    </div>
    <div class="modal-footer">
      <a href="#!" class="modal-close waves-effect btn-flat" data-i18n="detail.close">關閉</a>
    </div>
  </div>

  <!-- 依賴：jQuery / Materialize / FaberCastellCssLib + 資料 -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
  <script src="./faber-castell-color-lib.js"></script>
  <script src="./data/fc-colors.js"></script>

  <!-- i18n 引擎 + 語言字典（與 index.html 共用同一組 locales） -->
  <script src="./i18n.js"></script>
  <script src="./locales/zh-Hant.js"></script>
  <script src="./locales/en.js"></script>
  <script src="./locales/ja.js"></script>

  <script src="./side-tool.js"></script>
  <script src="./sets.js"></script>
</body>

</html>
